[package]
name = "notch-desktop"
version = "0.1.0"
description = "Overline — a Dynamic Island-style system layer for Windows"
authors = ["Dhyey"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "notch_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
serde_json = "1"

[dependencies]
tauri = { version = "2", features = ["tray-icon", "protocol-asset"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value", "preserve_order"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
tracing = "0.1.44"
tracing-appender = "0.2.5"
thiserror = "2.0.21"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
chrono = { version = "0.4.45", features = ["serde"] }
ts-rs = { version = "12.0.1", features = ["serde-compat", "chrono-impl"] }
tauri-plugin-single-instance = "2.5.0"
uuid = { version = "1.26.1", features = ["v4", "serde"] }
tokio = { version = "1.53.1", features = ["sync", "time", "macros"] }
tauri-plugin-global-shortcut = "2.4.0"
tauri-plugin-autostart = "2.6.0"
sha2 = "0.11.0"
base64 = "0.23.1"
rand = "0.10.3"
url = "2.5.8"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls", "query", "form"] }
keyring = { version = "3", features = ["windows-native"] }
notify = "8.2.0"
tauri-plugin-dialog = "2.8.0"
tiny_http = "0.12.0"
png = "0.18"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp", "gif", "bmp"] }
lopdf = { version = "0.45.0", default-features = false }
hmac = "0.13.0"
sha1 = "0.11.0"
aes-gcm = "0.11.1"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[target.'cfg(windows)'.dependencies]
windows-core = "0.61"
windows-collections = "0.2"
windows-future = "0.2"
# Same major as Tauri's own `windows` dependency so HWND types line up.
windows = { version = "0.61", features = [
    "ApplicationModel",
    "Foundation",
    "Devices_Enumeration",
    "Devices_Radios",
    "Graphics_Imaging",
    "Media_Ocr",
    "Security_Credentials_UI",
    "Networking_Connectivity",
    "Networking_NetworkOperators",
    "Win32_Devices_DeviceAndDriverInstallation",
    "Win32_Globalization",
    "Win32_NetworkManagement_Ndis",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_UI_Input_XboxController",
    "Devices_Geolocation",
    "Foundation_Collections",
    "Media_Control",
    "Storage_Streams",
    "UI_Notifications",
    "UI_Notifications_Management",
    "Win32_Foundation",
    "Win32_Storage_Xps",
    "Win32_System_Registry",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_System_Rpc",
    "Win32_System_Wmi",
    "Win32_System_SystemInformation",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_System_Variant",
    "Win32_System_SystemServices",
    "Win32_System_Power",
    "Win32_System_Com_StructuredStorage",
    "Win32_Media_Audio_Endpoints",
    "Win32_Devices_FunctionDiscovery",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Media_Audio",
    "Win32_Media_MediaFoundation",
    "Win32_NetworkManagement_IpHelper",
    "Win32_Networking_WinSock",
    "Win32_System_Com",
    "Win32_System_DataExchange",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_Threading",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_WinRT",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_Accessibility",
    "Win32_UI_WindowsAndMessaging",
] }
