[package]
name = "notch-desktop"
version = "0.1.0"
description = "Notch Desktop — a Dynamic Island-style system layer for Windows"
authors = ["Dhyey"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "notch_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "protocol-asset"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.40.2", features = ["bundled"] }
tracing = "0.1.44"
tracing-appender = "0.2.5"
thiserror = "2.0.21"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
chrono = { version = "0.4.45", features = ["serde"] }
ts-rs = { version = "12.0.1", features = ["serde-compat", "chrono-impl"] }
tauri-plugin-single-instance = "2.5.0"
uuid = { version = "1.26.1", features = ["v4", "serde"] }
tokio = { version = "1.53.1", features = ["sync", "time", "macros"] }
tauri-plugin-global-shortcut = "2.4.0"
tauri-plugin-autostart = "2.6.0"
sha2 = "0.11.0"
base64 = "0.23.1"
rand = "0.10.3"
url = "2.5.8"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls", "query", "form"] }
keyring = { version = "3", features = ["windows-native"] }
notify = "8.2.0"
tauri-plugin-dialog = "2.8.0"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[target.'cfg(windows)'.dependencies]
windows-core = "0.61"
# Same major as Tauri's own `windows` dependency so HWND types line up.
windows = { version = "0.61", features = [
    "Foundation",
    "Media_Control",
    "Storage_Streams",
    "Win32_Foundation",
    "Win32_System_WinRT",
    "Win32_UI_WindowsAndMessaging",
] }
